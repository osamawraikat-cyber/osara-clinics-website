name: PR2 preview validation
on:
  push:
    branches:
      - verification/pr2-preview
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP dependencies
        run: pip install requests beautifulsoup4
      - name: Validate HTTP SEO routing and links
        run: python .github/verify_pr2.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Validate mobile console and CTAs
        run: node .github/verify_pr2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2-preview-validation
          path: |
            http-report.json
            browser-report.json
