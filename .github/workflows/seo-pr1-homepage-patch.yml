name: SEO PR1 homepage patch

on:
  push:
    branches:
      - seo/pr1-foundation
    paths:
      - .github/workflows/seo-pr1-homepage-patch.yml

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr1-foundation
      - name: Patch index.html without medical-copy changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Canonical host and entity URLs only.
          s = s.replace('<link rel="canonical" href="https://www.osaraclinics.com/">', '<link rel="canonical" href="https://osaraclinics.com/">\n    <meta property="og:type" content="website">\n    <meta property="og:title" content="عيادات أوسارا — جلدية وعيون في أبو نصير، عمّان">\n    <meta property="og:description" content="عيادات أوسارا للأمراض الجلدية وطب العيون في أبو نصير، عمّان.">\n    <meta property="og:url" content="https://osaraclinics.com/">\n    <meta property="og:image" content="https://osaraclinics.com/assets/logo.png">')
          s = s.replace('https://www.osaraclinics.com/assets/logo.png', 'https://osaraclinics.com/assets/logo.png')
          s = s.replace('https://www.osaraclinics.com/#clinic', 'https://osaraclinics.com/#clinic')
          s = s.replace('"url": "https://www.osaraclinics.com"', '"url": "https://osaraclinics.com/"')

          # Connect visible clinic entity to the two physician entities using only verified names/specialties.
          needle = '''      "medicalSpecialty": [\n        "Dermatology",\n        "Ophthalmology"\n      ]'''
          replacement = '''      "employee": [\n        {\n          "@type": "Physician",\n          "@id": "https://osaraclinics.com/doctors/dr-osama-alwreikat#physician",\n          "name": "Dr. Osama Alwreikat | د. أسامة الوريكات",\n          "url": "https://osaraclinics.com/doctors/dr-osama-alwreikat",\n          "medicalSpecialty": "Dermatology"\n        },\n        {\n          "@type": "Physician",\n          "@id": "https://osaraclinics.com/doctors/dr-sara-abu-touq#physician",\n          "name": "Dr. Sara Abu Touq | د. سارة أبو طوق",\n          "url": "https://osaraclinics.com/doctors/dr-sara-abu-touq",\n          "medicalSpecialty": "Ophthalmology"\n        }\n      ],\n      "medicalSpecialty": [\n        "Dermatology",\n        "Ophthalmology"\n      ]'''
          if needle not in s:
              raise SystemExit('Expected homepage schema specialty block not found')
          s = s.replace(needle, replacement, 1)

          # Specialty hubs from the primary navigation.
          s = s.replace('<a href="#medical-derm">', '<a href="/dermatology">', 1)
          s = s.replace('<a href="#ophthalmology">', '<a href="/ophthalmology">', 1)

          # Preserve backing filenames but make crawlable public internal links extensionless.
          for old, new in {
              'href="vitiligo-jordan.html"': 'href="/vitiligo-jordan"',
              'href="botox-hyperhidrosis.html"': 'href="/botox-hyperhidrosis"',
              'href="mole-removal.html"': 'href="/mole-removal"',
              'href="school-health.html"': 'href="/school-health"',
          }.items():
              s = s.replace(old, new)

          # Add physician profile links without changing bios or medical wording.
          osama_marker = '<p class="doctor-bio-en" dir="ltr" style="margin-top: -8px; font-size: 0.85rem; color: var(--primary);"><strong>🇹🇷 Türkçe:</strong>'
          osama_pos = s.find(osama_marker)
          if osama_pos < 0:
              raise SystemExit('Osama doctor marker not found')
          osama_end = s.find('</p>', osama_pos) + 4
          s = s[:osama_end] + '\n                        <p><a href="/doctors/dr-osama-alwreikat" class="card-inline-link">الملف الطبي | Physician profile ↗</a></p>' + s[osama_end:]

          sara_bio = '<p class="doctor-bio-en" dir="ltr">Ophthalmologist at OSara Clinics, Abu Nusair, Amman. Dr. Sara Abu Touq provides comprehensive eye care for all ages by prior appointment. Book via WhatsApp.</p>'
          if sara_bio not in s:
              raise SystemExit('Sara doctor marker not found')
          s = s.replace(sara_bio, sara_bio + '\n                        <p><a href="/doctors/dr-sara-abu-touq" class="card-inline-link">الملف الطبي | Physician profile ↗</a></p>', 1)

          # Existing service-card consultation CTAs become appointment events; medical text untouched.
          s = s.replace('class="card-btn" target="_blank" rel="noopener">', 'class="card-btn book-appointment" data-appointment target="_blank" rel="noopener">')

          # Shared privacy-safe analytics helper.
          if '/assets/analytics.js' not in s:
              s = s.replace('</body>', '    <script src="/assets/analytics.js" defer></script>\n</body>')

          p.write_text(s)
          PY
      - name: Verify only intended homepage signals changed
        run: |
          grep -q 'https://osaraclinics.com/#clinic' index.html
          grep -q 'href="/dermatology"' index.html
          grep -q 'href="/ophthalmology"' index.html
          grep -q '/assets/analytics.js' index.html
          git diff --check
      - name: Commit branch-only patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-pr1-homepage-patch.yml
          git add index.html
          git commit -m "Normalize homepage SEO entities and internal links"
          git push origin HEAD:seo/pr1-foundation
