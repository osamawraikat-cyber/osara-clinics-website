name: Wave 1 finalize
on:
  push:
    branches: [seo/wave1-predeploy]
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'finalize Wave 1 integration QA')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate and validate
        run: python scripts/wave1_finalize.py
      - name: Verify exact scope and self-clean
        run: |
          rm -f .github/workflows/wave1-finalize.yml .github/workflows/wave1-predeploy-build.yml scripts/wave1_finalize.py scripts/wave1_generator.py.gz
          rmdir scripts 2>/dev/null || true
          python - <<'PY'
          import subprocess,sys
          base='e36fccf5c72781ba7314ceddf8d42a0b57b4e0f6'
          expected={'vitiligo-surgery-jordan.html','melanocyte-transplantation-vitiligo.html','punch-grafting-vitiligo.html','acne-treatment.html','hair-loss-treatment.html','wart-removal-cryotherapy.html','skin-biopsy.html','melasma-pigmentation-treatment.html','cataract-surgery.html','glaucoma-treatment.html','diabetic-eye-exam-retinopathy.html','pterygium-treatment-surgery.html','pediatric-ophthalmology.html','strabismus-treatment.html','dry-eye-treatment.html','dermatology.html','ophthalmology.html','doctors/dr-osama-alwreikat.html','doctors/dr-sara-abu-touq.html','vitiligo-jordan.html','school-health.html','sitemap.xml','MEDICAL_REVIEW_REQUIRED.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base]).decode().splitlines())
          if changed!=expected:
              print('scope mismatch',sorted(changed^expected)); sys.exit(1)
          print('Exact implementation scope PASS:',len(changed),'files')
          PY
      - name: Commit final predeploy state
        run: |
          git config user.name "osamawraikat-cyber"
          git config user.email "osamawraikat@gmail.com"
          git add -A
          git commit -m "feat: prepare Wave 1 SEO service architecture [skip ci] [skip netlify]"
          git push origin HEAD:seo/wave1-predeploy
