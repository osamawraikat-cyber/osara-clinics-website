name: SEO PR1 validation

on:
  push:
    branches:
      - seo/pr1-foundation
    paths:
      - .github/workflows/seo-pr1-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr1-foundation
      - name: Fix encoding typo and validate SEO artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET

          # Correct an accidental encoded-text typo introduced during branch editing.
          p = Path('botox-hyperhidrosis.html')
          s = p.read_text()
          s = s.replace('%D8%B9%D9%8A%D8%A7%D8%AF%D8%A7%D8%A7%D8%AA', '%D8%B9%D9%8A%D8%A7%D8%AF%D8%A7%D8%AA')
          p.write_text(s)

          expected = {
              'index.html': 'https://osaraclinics.com/',
              'dermatology.html': 'https://osaraclinics.com/dermatology',
              'ophthalmology.html': 'https://osaraclinics.com/ophthalmology',
              'doctors/dr-osama-alwreikat.html': 'https://osaraclinics.com/doctors/dr-osama-alwreikat',
              'doctors/dr-sara-abu-touq.html': 'https://osaraclinics.com/doctors/dr-sara-abu-touq',
              'vitiligo-jordan.html': 'https://osaraclinics.com/vitiligo-jordan',
              'botox-hyperhidrosis.html': 'https://osaraclinics.com/botox-hyperhidrosis',
              'mole-removal.html': 'https://osaraclinics.com/mole-removal',
              'school-health.html': 'https://osaraclinics.com/school-health',
          }

          for file, canonical in expected.items():
              text = Path(file).read_text()
              assert f'<link rel="canonical" href="{canonical}">' in text, (file, 'canonical')
              assert 'https://www.osaraclinics.com' not in text, (file, 'www host remains')
              assert '/assets/analytics.js' in text, (file, 'analytics include')
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.S):
                  json.loads(block)

          ET.parse('sitemap.xml')
          sitemap = Path('sitemap.xml').read_text()
          for canonical in expected.values():
              assert f'<loc>{canonical}</loc>' in sitemap, canonical

          robots = Path('robots.txt').read_text()
          assert 'Sitemap: https://osaraclinics.com/sitemap.xml' in robots

          analytics = Path('assets/analytics.js').read_text()
          for event in ('whatsapp_click','phone_click','directions_click','appointment_click'):
              assert event in analytics, event
          PY
          git diff --check
      - name: Commit cleanup and remove one-shot validator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-pr1-validate.yml
          git add botox-hyperhidrosis.html
          git commit -m "Validate SEO foundation and clean conversion link"
          git push origin HEAD:seo/pr1-foundation
