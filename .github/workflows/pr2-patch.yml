name: Temporary PR2 scoped patch
on:
  push:
    branches:
      - seo/pr2-service-intent
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr2-service-intent
          fetch-depth: 0
      - name: Apply scoped PR2 updates
        run: python .github/pr2_patch.py
      - name: Validate diff
        run: git diff --check
      - name: Commit scoped updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vitiligo-jordan.html botox-hyperhidrosis.html mole-removal.html MEDICAL_REVIEW_REQUIRED.md
          git commit -m "Add PR2 internal links and medical review flags"
          git push origin HEAD:seo/pr2-service-intent
