name: PR5 final validation
on:
  push:
    branches:
      - verification/pr5-final
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Static SEO/routing/location checks
        run: python .github/verify_pr5_static.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser/mobile/analytics checks
        run: node .github/verify_pr5_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr5-final-validation
          path: |
            pr5-static.json
            pr5-browser.json
            pr5-screenshots/
