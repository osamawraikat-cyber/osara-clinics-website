name: Temporary PR2 content refinement
on:
  push:
    branches:
      - seo/pr2-service-intent
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr2-service-intent
          fetch-depth: 0
      - name: Apply refinements
        run: python .github/pr2_refine.py
      - name: Validate diff
        run: git diff --check
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psoriasis-treatment.html acne-scar-treatment.html MEDICAL_REVIEW_REQUIRED.md
          git commit -m "Refine PR2 bilingual content and explicit CTAs"
          git push origin HEAD:seo/pr2-service-intent
