name: Apply approved PR blocker fixes

on:
  push:
    branches: [seo/pr1-foundation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr1-foundation
          fetch-depth: 0
      - name: Apply scoped fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          old='''      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Saturday",
            "Sunday",
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday"
          ],
          "opens": "09:00",
          "closes": "20:00"
        }
      ],'''
          new='''      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday", "Sunday"],
          "opens": "16:30",
          "closes": "20:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
          "opens": "08:00",
          "closes": "13:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
          "opens": "16:30",
          "closes": "20:30"
        }
      ],'''
          if old not in s: raise SystemExit('opening hours schema block not found')
          s=s.replace(old,new,1)
          s=s.replace('ساعات العمل: اتصل للاستفسار | Working hours: Call to enquire','ساعات العمل المنتظمة | Regular clinic hours',1)

          hours='''<ul class="hours-list">
                        <li class="hours-item">
                            <div class="day-title">
                                <span class="day-ar">السبت - الأحد</span>
                                <span class="day-en">Saturday - Sunday</span>
                            </div>
                            <div class="time-val">
                                <span class="time-ar">16:30 - 20:30</span>
                                <span class="time-en">4:30 PM - 8:30 PM</span>
                            </div>
                        </li>
                        <li class="hours-item">
                            <div class="day-title">
                                <span class="day-ar">الإثنين - الخميس</span>
                                <span class="day-en">Monday - Thursday</span>
                            </div>
                            <div class="time-val">
                                <span class="time-ar">08:00 - 13:30<br>16:30 - 20:30</span>
                                <span class="time-en">8:00 AM - 1:30 PM<br>4:30 PM - 8:30 PM</span>
                            </div>
                        </li>
                        <li class="hours-item">
                            <div class="day-title">
                                <span class="day-ar">الجمعة</span>
                                <span class="day-en">Friday</span>
                            </div>
                            <div class="time-val">
                                <span class="time-ar" style="color: #EF4444;">مغلق</span>
                                <span class="time-en">Closed</span>
                            </div>
                        </li>
                    </ul>
                    <div style="margin-top:16px;padding:14px 16px;border-radius:10px;background:#F7F3EC;color:#475569;">
                        <p style="margin:0 0 8px;"><strong>ملاحظة المواعيد:</strong> قد تختلف المواعيد والتوافر أحياناً؛ يرجى الاتصال أو التواصل عبر واتساب للتأكيد.</p>
                        <p class="en-text" style="margin:0;">Appointments and availability may occasionally vary; please call or WhatsApp to confirm.</p>
                    </div>
                    <div style="margin-top:14px;padding:16px;border:1px solid rgba(13,92,96,.18);border-radius:10px;background:#E6F3F4;">
                        <p style="margin:0 0 8px;"><strong>تواصل للحالات العاجلة خارج ساعات العمل:</strong> للحالات الجلدية أو العينية العاجلة، يمكن التواصل معنا <a href="tel:+962778423361">هاتفياً</a> أو عبر <a href="https://wa.me/962778423361" target="_blank" rel="noopener">واتساب</a>. في الحالات الشديدة أو المهددة للبصر أو الحياة، توجّه إلى أقرب قسم طوارئ مناسب.</p>
                        <p class="en-text" style="margin:0;">For urgent dermatological or ophthalmological concerns outside regular clinic hours, you may contact OSara Clinics by <a href="tel:+962778423361">phone</a> or <a href="https://wa.me/962778423361" target="_blank" rel="noopener">WhatsApp</a>. For severe, sight-threatening, or life-threatening emergencies, go to the nearest appropriate emergency department.</p>
                    </div>'''
          pattern=r'<ul class="hours-list">.*?</ul>'
          s2,n=re.subn(pattern,hours,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'hours list replacement count={n}')
          p.write_text(s2)

          for f,img in [('doctors/dr-osama-alwreikat.html','dr_osama.png'),('doctors/dr-sara-abu-touq.html','dr_sara.png')]:
              p=Path(f); s=p.read_text()
              s=re.sub(r'\n\s*<meta property="og:image"[^>]+>', '', s, count=1)
              s=s.replace(f',"image":"https://osaraclinics.com/assets/{img}"','',1)
              s=re.sub(r'<section class="profile"><img[^>]+><div>', '<section class="profile"><div>', s, count=1)
              s=s.replace('</div></section>\n  <section><h2>التخصص والخدمات المرتبطة</h2>', '</div></section>\n  <section><h2>التخصص والخدمات المرتبطة</h2>',1)
              s=s.replace('.profile{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:28px;align-items:center}.profile img{max-width:100%;border-radius:18px}', '.profile{display:block}',1)
              p.write_text(s)
          PY

          git diff --check
          git diff -- index.html doctors/dr-osama-alwreikat.html doctors/dr-sara-abu-touq.html

      - name: Commit scoped fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html doctors/dr-osama-alwreikat.html doctors/dr-sara-abu-touq.html
          git commit -m "Resolve opening-hours and physician portrait blockers"
          git push origin HEAD:seo/pr1-foundation
