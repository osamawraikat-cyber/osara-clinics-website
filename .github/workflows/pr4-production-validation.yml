name: PR4 production validation
on:
  push:
    branches:
      - verification/pr4-production
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Production static SEO/routing checks
        run: python .github/verify_pr4_prod.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Production browser/mobile/analytics checks
        run: node .github/verify_pr4_prod.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr4-production-validation
          path: |
            pr4-prod-static.json
            pr4-prod-browser.json
            pr4-prod-screenshots/
