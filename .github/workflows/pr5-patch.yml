name: PR5 patch
on:
  push:
    branches:
      - fix/pr5-contact-location
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr5-contact-location
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/pr5_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.html doctors/*.html assets/contact-cta.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix specialty, directions and contact CTAs"
          git push origin HEAD:fix/pr5-contact-location
