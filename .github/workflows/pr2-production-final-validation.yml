name: PR2 production final validation
on:
  push:
    branches:
      - verification/pr2-production-final
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm review ledger boundaries
        run: |
          grep -q 'PR #2 physician-reviewed items — APPROVED' MEDICAL_REVIEW_REQUIRED.md
          grep -q 'Older PR #1 flags above remain pending' MEDICAL_REVIEW_REQUIRED.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python .github/verify_pr2_prod.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - run: node .github/verify_pr2_prod.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr2-production-final-validation
          path: |
            prod-http.json
            prod-browser.json
