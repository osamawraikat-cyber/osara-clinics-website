name: Wave 1 integrate and static QA
on:
  push:
    branches: [seo/wave1-predeploy]
permissions:
  contents: write
jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, 'wave1 integrated')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate internal links, sitemap and medical review
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET

          marker='<!-- WAVE1-INTERNAL-LINKS -->'
          def insert_before_contact(path, html):
              p=Path(path); s=p.read_text()
              if marker in s: return
              needle='<section class="osara-contact-block"'
              if needle not in s: raise SystemExit(f'contact block not found: {path}')
              s=s.replace(needle, marker+'\n'+html+'\n'+needle,1)
              p.write_text(s)

          insert_before_contact('dermatology.html','''<section class="card"><h2>أدلة العلاج والخدمات | Treatment & service guides</h2><div class="links"><a href="/vitiligo-surgery-jordan">جراحة البهاق | Vitiligo Surgery</a><a href="/melanocyte-transplantation-vitiligo">زراعة الخلايا الصبغية | NCMT</a><a href="/punch-grafting-vitiligo">Punch Minigrafting للبهاق</a><a href="/acne-treatment">علاج حب الشباب | Acne Treatment</a><a href="/hair-loss-treatment">علاج تساقط الشعر | Hair Loss</a><a href="/wart-removal-cryotherapy">الثآليل والكرايوثيرابي | Warts & Cryotherapy</a><a href="/skin-biopsy">خزعة الجلد | Skin Biopsy</a><a href="/melasma-pigmentation-treatment">الكلف والتصبغات | Melasma & Pigmentation</a></div></section>''')
          insert_before_contact('ophthalmology.html','''<section class="card"><h2>أدلة طب العيون | Eye-care guides</h2><div class="links"><a href="/cataract-surgery">عملية المياه البيضاء / الساد | Cataract Surgery</a><a href="/glaucoma-treatment">الجلوكوما / المياه الزرقاء | Glaucoma</a><a href="/diabetic-eye-exam-retinopathy">فحص العين للسكري واعتلال الشبكية</a><a href="/pterygium-treatment-surgery">علاج وعملية الظفرة | Pterygium</a><a href="/pediatric-ophthalmology">طب عيون الأطفال | Pediatric Ophthalmology</a><a href="/strabismus-treatment">علاج الحول | Strabismus</a><a href="/dry-eye-treatment">علاج جفاف العين | Dry Eye</a></div></section>''')
          insert_before_contact('vitiligo-jordan.html','''<section class="card-box"><h2>جراحة البهاق للحالات المختارة</h2><div class="h2-en">Vitiligo surgery for selected patients</div><p>في بعض حالات البهاق المستقر وبعد التقييم الطبي قد تُناقش خيارات جراحية منفصلة عن العلاج العام. اقرأ دليل جراحة البهاق ثم صفحات التقنيات المحددة.</p><div class="links"><a href="/vitiligo-surgery-jordan">جراحة البهاق | Vitiligo Surgery</a><a href="/melanocyte-transplantation-vitiligo">زراعة الخلايا الصبغية غير المزروعة | NCMT</a><a href="/punch-grafting-vitiligo">Punch Minigrafting</a></div></section>''')
          insert_before_contact('doctors/dr-osama-alwreikat.html','''<section class="card"><h2>أدلة مرتبطة بخدمات الجلدية | Related dermatology guides</h2><div class="links"><a href="/vitiligo-surgery-jordan">جراحة البهاق</a><a href="/melanocyte-transplantation-vitiligo">NCMT / زراعة الخلايا الصبغية</a><a href="/punch-grafting-vitiligo">Punch Minigrafting</a><a href="/acne-treatment">حب الشباب</a><a href="/hair-loss-treatment">تساقط الشعر</a><a href="/wart-removal-cryotherapy">الثآليل والكرايوثيرابي</a><a href="/skin-biopsy">خزعة الجلد</a><a href="/melasma-pigmentation-treatment">الكلف والتصبغات</a></div></section>''')
          insert_before_contact('doctors/dr-sara-abu-touq.html','''<section class="card"><h2>أدلة مرتبطة بطب العيون | Related ophthalmology guides</h2><p>للحالات الجراحية التي تحتاج غرفة عمليات، تكون الاستشارة والتخطيط والمتابعة عبر مسار الرعاية مع د. سارة، وتتم العملية في مستشفى أو منشأة جراحية مناسبة عند الحاجة.</p><div class="links"><a href="/cataract-surgery">عملية المياه البيضاء / الساد</a><a href="/glaucoma-treatment">الجلوكوما</a><a href="/diabetic-eye-exam-retinopathy">فحص العين للسكري</a><a href="/pterygium-treatment-surgery">الظفرة</a><a href="/pediatric-ophthalmology">طب عيون الأطفال</a><a href="/strabismus-treatment">الحول</a><a href="/dry-eye-treatment">جفاف العين</a></div></section>''')
          insert_before_contact('school-health.html','''<section class="card-box"><h2>روابط عيون الأطفال | Pediatric eye links</h2><div class="links"><a href="/pediatric-ophthalmology">طب عيون الأطفال | Pediatric Ophthalmology</a><a href="/strabismus-treatment">الحول | Strabismus</a></div></section>''')
          insert_before_contact('acne-scar-treatment.html','''<section class="card"><h2>روابط ذات صلة | Related guides</h2><div class="links"><a href="/acne-treatment">علاج حب الشباب النشط | Active Acne Treatment</a><a href="/melasma-pigmentation-treatment">الكلف والتصبغات | Pigmentation</a></div></section>''')

          # Sitemap: preserve existing entries and append Wave 1 exactly once.
          sm=Path('sitemap.xml')
          tree=ET.parse(sm); root=tree.getroot(); ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          existing={u.find(ns+'loc').text for u in root.findall(ns+'url')}
          new_routes=['vitiligo-surgery-jordan','melanocyte-transplantation-vitiligo','punch-grafting-vitiligo','acne-treatment','hair-loss-treatment','wart-removal-cryotherapy','skin-biopsy','melasma-pigmentation-treatment','cataract-surgery','glaucoma-treatment','diabetic-eye-exam-retinopathy','pterygium-treatment-surgery','pediatric-ophthalmology','strabismus-treatment','dry-eye-treatment']
          for r in new_routes:
              url='https://osaraclinics.com/'+r
              if url in existing: continue
              e=ET.SubElement(root,ns+'url'); ET.SubElement(e,ns+'loc').text=url; ET.SubElement(e,ns+'lastmod').text='2026-09-10'
          ET.register_namespace('', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          tree.write(sm,encoding='utf-8',xml_declaration=True)

          # Add physician-review queue; do not modify prior decisions.
          mr=Path('MEDICAL_REVIEW_REQUIRED.md'); s=mr.read_text()
          heading='## Wave 1 pre-deployment pages — PHYSICIAN REVIEW REQUIRED'
          if heading not in s:
              s += '''\n\n## Wave 1 pre-deployment pages — PHYSICIAN REVIEW REQUIRED\n\nThe following pages are implementation drafts only and **are not physician-approved yet**. They must be reviewed in context before production. Existing pending and approved items above are unchanged.\n\n| URL | Review focus | Status |\n|---|---|---|\n| `/vitiligo-surgery-jordan` | Candidacy/stability wording; availability through OSara; realistic expectations; no outcome guarantee. | **PENDING** |\n| `/melanocyte-transplantation-vitiligo` | NCMT definition, donor/recipient pathway, aftercare, phototherapy wording, repigmentation expectations. | **PENDING** |\n| `/punch-grafting-vitiligo` | Technique description, candidacy/stability, donor/recipient sites, recovery, comparison with NCMT. | **PENDING** |\n| `/acne-treatment` | Indications, oral/topical treatment framing, scarring statements and follow-up wording. | **PENDING** |\n| `/hair-loss-treatment` | Differential diagnosis, testing, medical treatments and PRP wording; explicit distinction from surgical hair transplant. | **PENDING** |\n| `/wart-removal-cryotherapy` | Cryotherapy indications, expected reactions, repeat sessions and site-specific risks. | **PENDING** |\n| `/skin-biopsy` | Biopsy indications/types, local anaesthesia, histopathology and wound-care wording. | **PENDING** |\n| `/melasma-pigmentation-treatment` | Light protection, topical/procedural options, recurrence and pigmentation-risk wording. | **PENDING** |\n| `/cataract-surgery` | Cataract indications, lens-planning wording, hospital operating pathway, Dr. Sara's role, recovery/outcome wording. | **PENDING** |\n| `/glaucoma-treatment` | Diagnostic testing, target-pressure concept, drops/laser/surgery wording and hospital pathway. | **PENDING** |\n| `/diabetic-eye-exam-retinopathy` | Screening/follow-up framing without fixed universal interval; retinal referral/co-management wording. | **PENDING** |\n| `/pterygium-treatment-surgery` | Indications for surgery, recurrence wording, operative pathway and aftercare. | **PENDING** |\n| `/pediatric-ophthalmology` | Examination indications, cycloplegic refraction, amblyopia/strabismus wording; avoid universal screening interval. | **PENDING** |\n| `/strabismus-treatment` | Functional/visual claims, amblyopia relationship, surgery indications, hospital pathway and surgeon-role wording. | **PENDING** |\n| `/dry-eye-treatment` | Diagnostic pattern, treatment categories, red-flag wording and scope of available testing. | **PENDING** |\n\nReview rule: numerical success rates, guaranteed outcomes, permanent/scar-free/best/safe language, fixed durations, FDA claims and absolute indications remain prohibited unless specifically evidence-supported and physician-approved. Surgical pages must clearly distinguish a service available through the OSara/physician care pathway from the physical operating location.\n'''
              mr.write_text(s)
          PY
      - name: Static pre-deploy QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,xml.etree.ElementTree as ET
          old=['','dermatology','ophthalmology','doctors/dr-osama-alwreikat','doctors/dr-sara-abu-touq','vitiligo-jordan','botox-hyperhidrosis','mole-removal','school-health','psoriasis-treatment','acne-scar-treatment']
          new=['vitiligo-surgery-jordan','melanocyte-transplantation-vitiligo','punch-grafting-vitiligo','acne-treatment','hair-loss-treatment','wart-removal-cryotherapy','skin-biopsy','melasma-pigmentation-treatment','cataract-surgery','glaucoma-treatment','diabetic-eye-exam-retinopathy','pterygium-treatment-surgery','pediatric-ophthalmology','strabismus-treatment','dry-eye-treatment']
          routes=old+new
          files={r:(Path('index.html') if r=='' else Path(r+'.html')) for r in routes}
          errs=[]; titles={}; cans={}; inbound={r:0 for r in routes}
          for r,p in files.items():
              if not p.exists(): errs.append(f'missing {p}'); continue
              s=p.read_text()
              h1=len(re.findall(r'<h1\b',s,re.I));
              if h1!=1: errs.append(f'{r or "/"}: H1={h1}')
              tm=re.search(r'<title>(.*?)</title>',s,re.I|re.S); title=tm.group(1).strip() if tm else ''
              if not title: errs.append(f'{r}: missing title')
              if title in titles: errs.append(f'duplicate title: {r} and {titles[title]}')
              titles[title]=r
              cm=re.search(r'<link\s+rel="canonical"\s+href="([^"]+)"',s,re.I); can=cm.group(1) if cm else ''
              expect='https://osaraclinics.com/'+r
              if r=='': expect='https://osaraclinics.com/'
              if can!=expect: errs.append(f'{r}: canonical {can} != {expect}')
              if can in cans: errs.append(f'duplicate canonical {r} {cans[can]}')
              cans[can]=r
              if not re.search(r'<meta\s+name="description"\s+content="[^"]+"',s,re.I): errs.append(f'{r}: missing description')
              for prop in ['og:type','og:title','og:description','og:url','og:image']:
                  if prop not in s: errs.append(f'{r}: missing {prop}')
              for block in re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>',s,re.I|re.S):
                  try: json.loads(block)
                  except Exception as e: errs.append(f'{r}: bad JSON-LD {e}')
              if 'G-72BY7LC2V2' not in s: errs.append(f'{r}: missing GA4')
              if '/assets/analytics.js' not in s: errs.append(f'{r}: missing analytics.js')
              if '/assets/site-nav.js' not in s: errs.append(f'{r}: missing site-nav.js')
              for href in re.findall(r'href="(/[^"]*)"',s):
                  target=href.split('#')[0].split('?')[0].rstrip('/')
                  tr=target.lstrip('/')
                  if tr in inbound: inbound[tr]+=1
          for r in new:
              if inbound[r]==0: errs.append(f'orphan new route: {r}')
          tree=ET.parse('sitemap.xml'); ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          sm=[u.find(ns+'loc').text for u in tree.getroot().findall(ns+'url')]
          expected=[('https://osaraclinics.com/' if r=='' else 'https://osaraclinics.com/'+r) for r in routes]
          if set(sm)!=set(expected) or len(sm)!=26: errs.append(f'sitemap count/set mismatch: {len(sm)}')
          # critical unchanged files and exact handoff inheritance
          import subprocess
          for f in ['OSARA_SEO_HANDOFF.md','robots.txt','netlify.toml','assets/analytics.js','assets/site-nav.js','assets/site-nav.css']:
              if subprocess.run(['git','diff','--quiet','e36fccf5c72781ba7314ceddf8d42a0b57b4e0f6','--',f]).returncode:
                  errs.append(f'unexpected change vs parent: {f}')
          if errs:
              print('\n'.join(errs)); raise SystemExit(1)
          print(f'PASS: {len(routes)} routes; {len(new)} new; sitemap={len(sm)}; no orphan new pages; JSON-LD parses; critical files unchanged')
          PY
      - name: Commit integrated result and remove temporary workflow
        run: |
          rm .github/workflows/wave1-integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "[skip netlify] wave1 integrated: links sitemap and medical review"
          git push origin HEAD:seo/wave1-predeploy
