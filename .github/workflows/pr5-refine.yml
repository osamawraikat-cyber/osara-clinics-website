name: PR5 refine
on:
  push:
    branches:
      - fix/pr5-contact-location
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr5-contact-location
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/pr5_refine.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html doctors/dr-osama-alwreikat.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine PR5 specialty and homepage styles"
          git push origin HEAD:fix/pr5-contact-location
