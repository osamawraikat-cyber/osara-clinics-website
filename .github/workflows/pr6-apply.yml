name: Apply PR6 navigation consistency
on:
  push:
    branches: [design/pr6-navigation-consistency]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply PR6 navigation consistency changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/pr6-navigation-consistency
          fetch-depth: 0
      - name: Patch navigation and footers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
            'dermatology.html','ophthalmology.html',
            'doctors/dr-osama-alwreikat.html','doctors/dr-sara-abu-touq.html',
            'vitiligo-jordan.html','botox-hyperhidrosis.html','mole-removal.html','school-health.html',
            'psoriasis-treatment.html','acne-scar-treatment.html'
          ]

          nav_css = r'''/* Shared OSara navigation/footer — homepage visual language */
          .osara-unified-nav-page { overflow-x: hidden; }
          .osara-global-topbar { background:#0D5C60; color:#fff; font-size:.85rem; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.1); }
          .osara-global-topbar .osara-nav-shell { width:100%; max-width:1200px; margin:0 auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center; }
          .osara-global-topbar .top-bar-info { display:flex; gap:20px; align-items:center; }
          .osara-global-topbar .top-bar-item { display:flex; align-items:center; gap:6px; }
          .osara-global-topbar a { color:#fff; text-decoration:none; }
          .osara-global-topbar .top-bar-socials { display:flex; gap:12px; }
          .osara-global-header { position:sticky; top:0; z-index:1000; background:rgba(255,255,255,.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid rgba(13,92,96,.06); box-shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03); }
          .osara-global-header .osara-nav-shell { width:100%; max-width:1200px; margin:0 auto; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
          .osara-global-header .logo-area { display:flex; align-items:center; text-decoration:none; margin-left:35px; }
          .osara-global-header .logo-img { height:72px; width:auto; display:block; object-fit:contain; }
          .osara-global-header .main-nav { display:flex; align-items:center; gap:24px; }
          .osara-global-header .nav-links { display:flex; align-items:center; list-style:none; gap:24px; margin:0; padding:0; }
          .osara-global-header .nav-links a { display:flex; flex-direction:column; align-items:center; text-decoration:none; color:#1E293B; padding:6px 4px; position:relative; line-height:1.2; }
          .osara-global-header .nav-links a .nav-ar { font-size:1rem; font-weight:700; }
          .osara-global-header .nav-links a .nav-en { font-family:'Outfit',sans-serif; font-size:.72rem; font-weight:500; color:#64748B; margin-top:2px; text-transform:uppercase; letter-spacing:.3px; }
          .osara-global-header .nav-links a::after { content:''; position:absolute; bottom:-2px; left:5%; width:0; height:2px; background:#0D5C60; transition:all .3s cubic-bezier(.4,0,.2,1); }
          .osara-global-header .nav-links a:hover,.osara-global-header .nav-links a.active { color:#0D5C60; }
          .osara-global-header .nav-links a:hover::after,.osara-global-header .nav-links a.active::after { width:100%; }
          .osara-global-header .nav-links a:hover .nav-en,.osara-global-header .nav-links a.active .nav-en { color:#0D5C60; }
          .osara-global-header .nav-actions { display:flex; align-items:center; gap:15px; }
          .osara-global-header .nav-actions .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:12px 28px; border-radius:8px; font-weight:600; text-decoration:none; font-size:.95rem; border:0; }
          .osara-global-header .nav-actions .btn-whatsapp { background:#25D366; color:#fff; box-shadow:0 4px 6px -1px rgba(0,0,0,.06); }
          .osara-global-header .mobile-menu-btn { display:none; background:none; border:0; color:#0D5C60; cursor:pointer; padding:10px; border-radius:8px; line-height:0; }
          .osara-drawer-head { display:none; }
          .osara-nav-scrim { display:none; }
          .osara-minimal-footer { background:#0F172A; color:#94A3B8; padding:32px 0; font-size:.9rem; }
          .osara-minimal-footer .osara-footer-inner { width:100%; max-width:1200px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
          .osara-minimal-footer .osara-footer-brand { display:flex; align-items:center; gap:12px; color:#fff; text-decoration:none; font-weight:700; }
          .osara-minimal-footer .osara-footer-brand img { height:44px; width:auto; filter:brightness(0) invert(1); }
          .osara-minimal-footer .osara-footer-links { display:flex; gap:18px; flex-wrap:wrap; }
          .osara-minimal-footer .osara-footer-links a { color:#94A3B8; text-decoration:none; }
          .osara-minimal-footer .osara-footer-links a:hover { color:#C5A880; }
          body.osara-nav-open { overflow:hidden; touch-action:none; }

          @media (max-width:768px) {
            .osara-global-topbar { display:none; }
            .osara-global-header .osara-nav-shell { padding:10px 20px; }
            .osara-global-header .logo-area { margin-left:0; }
            .osara-global-header .logo-img { height:58px; }
            .osara-global-header .mobile-menu-btn, .main-header .mobile-menu-btn { display:block; }
            .osara-global-header .main-nav, .main-header .main-nav {
              position:fixed !important;
              top:0 !important;
              right:-100% !important;
              bottom:0 !important;
              width:min(86vw,320px) !important;
              height:100vh !important;
              height:100dvh !important;
              min-height:100dvh !important;
              background:#fff !important;
              flex-direction:column !important;
              padding:0 24px 28px !important;
              box-shadow:-8px 0 28px rgba(15,23,42,.18) !important;
              transition:right .28s ease !important;
              align-items:stretch !important;
              z-index:1102 !important;
              overflow-y:auto !important;
              overscroll-behavior:contain;
            }
            .osara-global-header .main-nav.active, .main-header .main-nav.active { right:0 !important; }
            .osara-drawer-head { display:flex; min-height:82px; flex:0 0 auto; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid rgba(13,92,96,.08); margin:0 -4px 18px; padding:10px 0; }
            .osara-drawer-logo img { display:block; height:54px; width:auto; }
            .osara-drawer-close { width:44px; height:44px; display:grid; place-items:center; border:1px solid rgba(13,92,96,.15); border-radius:10px; background:#FCFAF7; color:#0D5C60; font-size:1.75rem; cursor:pointer; }
            .osara-global-header .nav-links, .main-header .nav-links { flex-direction:column !important; align-items:stretch !important; width:100% !important; gap:6px !important; }
            .osara-global-header .nav-links li, .main-header .nav-links li { width:100%; }
            .osara-global-header .nav-links a, .main-header .nav-links a { display:flex !important; flex-direction:row !important; justify-content:space-between; align-items:center !important; width:100%; min-height:48px; padding:9px 4px !important; }
            .osara-global-header .nav-links a::after, .main-header .nav-links a::after { display:none; }
            .osara-global-header .nav-actions, .main-header .nav-actions { margin-top:20px !important; width:100% !important; }
            .osara-global-header .nav-actions .btn, .main-header .nav-actions .btn { width:100% !important; min-height:50px; }
            .osara-nav-scrim { display:block; position:fixed; inset:0; background:rgba(15,23,42,.42); opacity:0; pointer-events:none; transition:opacity .28s ease; z-index:1101; }
            .osara-nav-scrim.active { opacity:1; pointer-events:auto; }
            .osara-minimal-footer .osara-footer-inner { flex-direction:column; text-align:center; }
            .osara-minimal-footer .osara-footer-links { justify-content:center; }
          }
          '''

          nav_js = r'''(function(){
            'use strict';
            function init(){
              var header=document.querySelector('.osara-global-header, .main-header');
              if(!header) return;
              var nav=header.querySelector('.main-nav');
              var toggle=header.querySelector('.mobile-menu-btn');
              if(!nav||!toggle) return;
              if(!nav.querySelector('.osara-drawer-head')){
                var head=document.createElement('div');
                head.className='osara-drawer-head';
                head.innerHTML='<a class="osara-drawer-logo" href="/" aria-label="OSara Clinics home"><img src="/assets/logo.png" alt="عيادات أوسارا | OSara Clinics"></a><button type="button" class="osara-drawer-close" aria-label="Close menu">×</button>';
                nav.insertBefore(head,nav.firstChild);
              }
              var scrim=document.querySelector('.osara-nav-scrim');
              if(!scrim){ scrim=document.createElement('div'); scrim.className='osara-nav-scrim'; scrim.setAttribute('aria-hidden','true'); document.body.appendChild(scrim); }
              var closeBtn=nav.querySelector('.osara-drawer-close');
              function setOpen(open){
                nav.classList.toggle('active',open); scrim.classList.toggle('active',open); document.body.classList.toggle('osara-nav-open',open);
                toggle.setAttribute('aria-expanded',open?'true':'false'); scrim.setAttribute('aria-hidden',open?'false':'true');
              }
              toggle.setAttribute('aria-expanded','false'); toggle.setAttribute('aria-controls',nav.id||'main-nav');
              toggle.addEventListener('click',function(){setOpen(!nav.classList.contains('active'));});
              closeBtn.addEventListener('click',function(){setOpen(false);});
              scrim.addEventListener('click',function(){setOpen(false);});
              nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setOpen(false);});});
              document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
              window.addEventListener('resize',function(){if(window.innerWidth>768)setOpen(false);});
              var path=window.location.pathname;
              nav.querySelectorAll('.nav-links a').forEach(function(a){
                a.classList.remove('active');
                var href=a.getAttribute('href')||'';
                if((path==='/'&&href==='/#hero')||(path==='/dermatology'&&href==='/dermatology')||(path==='/ophthalmology'&&href==='/ophthalmology')) a.classList.add('active');
              });
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();'''

          Path('assets/site-nav.css').write_text(nav_css,encoding='utf-8')
          Path('assets/site-nav.js').write_text(nav_js,encoding='utf-8')

          topbar = '''<div class="top-bar osara-global-topbar"><div class="osara-nav-shell"><div class="top-bar-info"><div class="top-bar-item"><span>☎</span><a href="tel:0778423361" dir="ltr">07 7842 3361</a></div><div class="top-bar-item"><span>◷</span><span>ساعات العمل المنتظمة | Regular clinic hours</span></div></div><div class="top-bar-socials"><a href="https://www.facebook.com/profile.php?id=61584046595246" target="_blank" rel="noopener" aria-label="Facebook">f</a><a href="https://www.instagram.com/osara.dermaclinics/" target="_blank" rel="noopener" aria-label="Instagram">◎</a></div></div></div>'''
          header = '''<header class="main-header osara-global-header"><div class="osara-nav-shell"><a href="/" class="logo-area"><img src="/assets/logo.png" alt="عيادات أوسارا | OSara Clinics" class="logo-img"></a><button class="mobile-menu-btn" type="button" aria-label="Open menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><nav class="main-nav" id="main-nav"><ul class="nav-links"><li><a href="/#hero"><span class="nav-ar">الرئيسية</span><span class="nav-en">Home</span></a></li><li><a href="/#doctors"><span class="nav-ar">الأطباء</span><span class="nav-en">Doctors</span></a></li><li><a href="/dermatology"><span class="nav-ar">الجلدية الطبية</span><span class="nav-en">Medical</span></a></li><li><a href="/#cosmetic-derm"><span class="nav-ar">التجميل</span><span class="nav-en">Cosmetic</span></a></li><li><a href="/ophthalmology"><span class="nav-ar">العيون</span><span class="nav-en">Eye Care</span></a></li><li><a href="/#why-us"><span class="nav-ar">لماذا نحن</span><span class="nav-en">Why Us</span></a></li><li><a href="/#location"><span class="nav-ar">موقعنا</span><span class="nav-en">Location</span></a></li></ul><div class="nav-actions"><a href="https://wa.me/962778423361" class="btn btn-whatsapp" target="_blank" rel="noopener"><span>واتساب | WhatsApp</span></a></div></nav></div></header>'''
          footer = '''<footer class="footer osara-minimal-footer"><div class="osara-footer-inner"><a class="osara-footer-brand" href="/"><img src="/assets/logo.png" alt="عيادات أوسارا | OSara Clinics"><span>عيادات أوسارا | OSara Clinics</span></a><nav class="osara-footer-links" aria-label="Footer navigation"><a href="/">الرئيسية</a><a href="/dermatology">الجلدية</a><a href="/ophthalmology">العيون</a><a href="/doctors/dr-osama-alwreikat">د. أسامة</a><a href="/doctors/dr-sara-abu-touq">د. سارة</a></nav><span>© OSara Clinics</span></div></footer>'''

          for fn in pages:
            p=Path(fn); s=p.read_text(encoding='utf-8')
            if 'assets/site-nav.css' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="/assets/site-nav.css">\n</head>',1)
            # Add scope class while preserving any existing body attrs/classes.
            s=re.sub(r'<body([^>]*)>',lambda m: '<body'+m.group(1)+(' class="osara-unified-nav-page"' if 'class=' not in m.group(1) else '')+'>',s,count=1)
            s=re.sub(r'<header\b[^>]*>.*?</header>',topbar+header,s,count=1,flags=re.S)
            s=re.sub(r'<footer\b[^>]*class="[^"]*footer[^"]*"[^>]*>.*?</footer>',footer,s,count=1,flags=re.S)
            if 'assets/site-nav.js' not in s:
              s=s.replace('</body>','<script src="/assets/site-nav.js" defer></script>\n</body>',1)
            p.write_text(s,encoding='utf-8')

          # Homepage: load shared assets only. Its desktop markup remains the source of truth;
          # shared mobile rules + JS fix its full-height drawer and inject in-drawer logo/close control.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'assets/site-nav.css' not in s: s=s.replace('</head>','    <link rel="stylesheet" href="/assets/site-nav.css">\n</head>',1)
          if 'assets/site-nav.js' not in s: s=s.replace('</body>','<script src="/assets/site-nav.js" defer></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/pr6-apply.yml
          git config user.name "osamawraikat-cyber"
          git config user.email "osamawraikat@gmail.com"
          git add assets/site-nav.css assets/site-nav.js index.html dermatology.html ophthalmology.html doctors/dr-osama-alwreikat.html doctors/dr-sara-abu-touq.html vitiligo-jordan.html botox-hyperhidrosis.html mole-removal.html school-health.html psoriasis-treatment.html acne-scar-treatment.html
          git commit -m "Unify site navigation and simplify inner footers"
          git push origin HEAD:design/pr6-navigation-consistency
