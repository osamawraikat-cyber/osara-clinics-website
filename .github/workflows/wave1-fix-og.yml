name: Wave 1 fix doctor OG images
on:
  push:
    branches: [seo/wave1-predeploy]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'fix OG images')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add verified doctor OG images
        run: |
          python - <<'PY'
          from pathlib import Path
          items={
            'doctors/dr-osama-alwreikat.html':'https://osaraclinics.com/assets/dr_osama.png',
            'doctors/dr-sara-abu-touq.html':'https://osaraclinics.com/assets/dr_sara.png'
          }
          for path,url in items.items():
              p=Path(path); s=p.read_text()
              if 'property="og:image"' in s: continue
              needle='<script type="application/ld+json">'
              if needle not in s: raise SystemExit(f'JSON-LD marker missing in {path}')
              s=s.replace(needle,f'<meta property="og:image" content="{url}">\n  '+needle,1)
              p.write_text(s)
          PY
      - name: Self-clean and commit
        run: |
          rm .github/workflows/wave1-fix-og.yml
          git config user.name "osamawraikat-cyber"
          git config user.email "osamawraikat@gmail.com"
          git add -A
          git commit -m "fix: complete doctor Open Graph metadata [skip ci] [skip netlify]"
          git push origin HEAD:seo/wave1-predeploy
