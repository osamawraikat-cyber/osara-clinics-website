name: Temporary PR3 GA4 patch
on:
  push:
    branches:
      - analytics/pr3-ga4
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analytics/pr3-ga4
          fetch-depth: 0
      - run: python .github/pr3_ga4_patch.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dermatology.html ophthalmology.html doctors/dr-osama-alwreikat.html doctors/dr-sara-abu-touq.html psoriasis-treatment.html acne-scar-treatment.html vitiligo-jordan.html botox-hyperhidrosis.html mole-removal.html school-health.html
          git commit -m "Install GA4 across canonical pages"
          git push origin HEAD:analytics/pr3-ga4