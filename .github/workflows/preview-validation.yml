name: Temporary final PR preview validation

on:
  push:
    branches:
      - seo/pr1-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE: https://deploy-preview-1--gregarious-malabi-0dc7e1.netlify.app
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Netlify preview
        run: |
          for i in {1..30}; do
            if curl -fsS "$PREVIEW_BASE/" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install HTTP dependencies
        run: pip install requests beautifulsoup4 >/dev/null
      - name: Validate HTTP, SEO, hours, portraits and internal links
        shell: bash
        run: |
          set -o pipefail
          python .github/validate_preview.py | tee http-report.json
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Validate mobile, console, rendered hours and CTAs
        shell: bash
        run: |
          set -o pipefail
          node .github/validate_preview.mjs | tee browser-report.stdout.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pr1-validation
          if-no-files-found: warn
          path: |
            http-report.json
            browser-report.json
            browser-report.stdout.json
            mobile-*.png
