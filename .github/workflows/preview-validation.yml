name: Temporary final preview diagnostics

on:
  push:
    branches: [seo/pr1-foundation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE: https://deploy-preview-1--gregarious-malabi-0dc7e1.netlify.app
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install requests >/dev/null
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test production www variants
        run: |
          python - <<'PY'
          import json,requests
          routes=['/','/vitiligo-jordan','/botox-hyperhidrosis','/mole-removal','/school-health']
          rows=[]
          for route in routes:
              variants=['/'] if route=='/' else [route,route+'/',route+'.html']
              for v in variants:
                  u='https://www.osaraclinics.com'+v
                  r=requests.get(u,allow_redirects=True,timeout=20)
                  rows.append({'requested':u,'chain':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history],'redirect_count':len(r.history),'final_status':r.status_code,'final_url':r.url})
          print(json.dumps(rows,indent=2))
          PY
      - name: Test directions event via DOM click
        shell: bash
        run: |
          set -o pipefail
          cat > directions.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
          await page.addInitScript(()=>document.addEventListener('click',e=>{if(e.target.closest?.('a[href]'))e.preventDefault()},true));
          await page.goto(process.env.PREVIEW_BASE+'/dermatology',{waitUntil:'networkidle'});
          await page.evaluate(()=>{window.gtag=undefined;window.dataLayer=[]});
          const selector='a[href*="google.com/maps"],a[href*="maps.app.goo.gl"],a[href*="goo.gl/maps"]';
          const result=await page.evaluate((selector)=>{
            const a=document.querySelector(selector);
            if(!a) return {found:false};
            const href=a.getAttribute('href');
            a.click();
            const dl=window.dataLayer||[];
            return {found:true,href,dataLayer:dl,eventCount:dl.filter(x=>x?.event==='directions_click').length,forbiddenKeys:[...new Set(dl.flatMap(x=>Object.keys(x||{})).filter(k=>/patient|diagnosis|symptom|message|text/i.test(k)))]};
          },selector);
          result.errors=errors;
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          JS
          node directions.mjs
