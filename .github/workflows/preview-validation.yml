name: Temporary final preview diagnostics

on:
  push:
    branches: [seo/pr1-foundation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BASE: https://deploy-preview-1--gregarious-malabi-0dc7e1.netlify.app
      PROD_BASE: https://osaraclinics.com
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install requests >/dev/null
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Compare production and preview URL behavior
        run: |
          python - <<'PY' | tee url-comparison.json
          import os,json,requests
          bases={'production':os.environ['PROD_BASE'],'preview':os.environ['PREVIEW_BASE']}
          routes=['/','/vitiligo-jordan','/botox-hyperhidrosis','/mole-removal','/school-health']
          out={}
          for label,base in bases.items():
              rows=[]
              for route in routes:
                  variants=['/'] if route=='/' else [route,route+'/',route+'.html']
                  for v in variants:
                      r=requests.get(base+v,allow_redirects=True,timeout=20)
                      rows.append({'requested':base+v,'redirects':[{'status':h.status_code,'url':h.url,'location':h.headers.get('location')} for h in r.history],'redirect_count':len(r.history),'final_status':r.status_code,'final_url':r.url})
              out[label]=rows
          print(json.dumps(out,indent=2))
          PY
      - name: Test directions CTA once
        shell: bash
        run: |
          set -o pipefail
          cat > directions.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
          await page.addInitScript(()=>document.addEventListener('click',e=>{if(e.target.closest?.('a[href]'))e.preventDefault()},true));
          await page.goto(process.env.PREVIEW_BASE+'/dermatology',{waitUntil:'networkidle'});
          await page.evaluate(()=>{window.gtag=undefined;window.dataLayer=[]});
          const link=page.locator('a[href*="google.com/maps"],a[href*="maps.app.goo.gl"],a[href*="goo.gl/maps"]').first();
          const found=await link.count();
          let result={found:!!found,errors};
          if(found){
            result.href=await link.getAttribute('href');
            await link.click(); await page.waitForTimeout(100);
            result.dataLayer=await page.evaluate(()=>window.dataLayer||[]);
            result.eventCount=result.dataLayer.filter(x=>x?.event==='directions_click').length;
            result.forbiddenKeys=[...new Set(result.dataLayer.flatMap(x=>Object.keys(x||{})).filter(k=>/patient|diagnosis|symptom|message|text/i.test(k)))];
          }
          fs.writeFileSync('directions-report.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          await browser.close();
          JS
          node directions.mjs | tee directions-report.stdout.json
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: final-preview-diagnostics
          if-no-files-found: error
          path: |
            url-comparison.json
            directions-report.json
            directions-report.stdout.json
