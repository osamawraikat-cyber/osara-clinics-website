name: Temporary source hours sync

on:
  push:
    branches:
      - seo/pr1-foundation

permissions:
  contents: write

jobs:
  sync-hours:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr1-foundation
          fetch-depth: 0
      - name: Update homepage source hours
        run: python .github/sync_hours.py
      - name: Validate scoped diff
        run: |
          git diff --check
          git diff -- index.html
      - name: Commit source-synced hours
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Source-sync clinic hours and urgent contact notice"
          git push origin HEAD:seo/pr1-foundation
