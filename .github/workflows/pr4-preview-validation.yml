name: PR4 preview validation
on:
  push:
    branches:
      - verification/pr4-preview
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Static SEO routing checks
        run: python .github/verify_pr4.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser visual mobile analytics checks
        run: node .github/verify_pr4.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr4-preview-validation
          path: |
            pr4-static.json
            pr4-browser.json
            pr4-screenshots/
      # Verification-only rerun after adding transient network retries.
