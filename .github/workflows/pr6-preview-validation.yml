name: PR6 exact preview validation
on:
  push:
    branches: [verification/pr6-preview]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static hosted-preview checks
        run: |
          pip install requests beautifulsoup4 >/dev/null
          cat > /tmp/pr6_static.py <<'PY'
          import requests,json,re,sys
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin,urlparse
          PRE='https://deploy-preview-6--gregarious-malabi-0dc7e1.netlify.app'
          PROD='https://osaraclinics.com'
          ROUTES=['/','/dermatology','/ophthalmology','/doctors/dr-osama-alwreikat','/doctors/dr-sara-abu-touq','/vitiligo-jordan','/botox-hyperhidrosis','/mole-removal','/school-health','/psoriasis-treatment','/acne-scar-treatment']
          S=requests.Session(); S.headers['User-Agent']='OSara-PR6-validation/1.0'
          errors=[]; rep={'routes':{},'variants':{},'broken_links':[],'broken_assets':[]}
          internal=set()
          for r in ROUTES:
            x=S.get(PRE+r,timeout=30); p=S.get(PROD+r,timeout=30)
            if x.status_code!=200: errors.append(f'{r} status {x.status_code}')
            soup=BeautifulSoup(x.text,'html.parser'); ps=BeautifulSoup(p.text,'html.parser')
            can=soup.find('link',rel='canonical'); pcan=ps.find('link',rel='canonical')
            if not can or not pcan or can.get('href')!=pcan.get('href'): errors.append(f'{r} canonical changed')
            title=soup.title.string.strip() if soup.title and soup.title.string else None
            ptitle=ps.title.string.strip() if ps.title and ps.title.string else None
            if title!=ptitle: errors.append(f'{r} title changed')
            md=soup.find('meta',attrs={'name':'description'}); pmd=ps.find('meta',attrs={'name':'description'})
            if (md.get('content') if md else None)!=(pmd.get('content') if pmd else None): errors.append(f'{r} meta changed')
            if len(soup.find_all('h1'))!=1: errors.append(f'{r} H1 count {len(soup.find_all("h1"))}')
            for sc in soup.find_all('script',type='application/ld+json'):
              try: json.loads(sc.string or sc.get_text())
              except Exception as e: errors.append(f'{r} JSON-LD {e}')
            ga=x.text.count('googletagmanager.com/gtag/js?id=G-72BY7LC2V2'); cfg=x.text.count("gtag('config', 'G-72BY7LC2V2')")
            if ga!=1 or cfg!=1: errors.append(f'{r} GA count {ga}/{cfg}')
            if x.text.count('connect.facebook.net')!=p.text.count('connect.facebook.net'): errors.append(f'{r} Meta Pixel marker changed')
            if r!='/' and len(soup.select('.osara-contact-block'))!=1: errors.append(f'{r} contact block count')
            if r!='/' and not soup.select_one('footer.osara-minimal-footer'): errors.append(f'{r} minimal footer missing')
            if r!='/' and soup.select_one('footer.osara-minimal-footer a[href^="tel:"],footer.osara-minimal-footer a[href*="maps.app"],footer.osara-minimal-footer a[href*="wa.me"]'): errors.append(f'{r} duplicate contact footer CTA')
            if not soup.select_one('.main-header .main-nav') or not soup.select_one('.mobile-menu-btn'): errors.append(f'{r} unified nav missing')
            for a in soup.find_all('a',href=True):
              href=a['href']
              if href.startswith('/'):
                path=href.split('#',1)[0]
                if path: internal.add(path)
            for tag,attr in [('img','src'),('script','src'),('link','href')]:
              for el in soup.find_all(tag):
                v=el.get(attr)
                if not v or not v.startswith('/'): continue
                if tag=='link' and el.get('rel') and 'canonical' in el.get('rel'): continue
                u=urljoin(PRE,v); rr=S.get(u,timeout=20)
                if rr.status_code>=400: rep['broken_assets'].append([r,v,rr.status_code]); errors.append(f'asset {v} {rr.status_code}')
            rep['routes'][r]={'status':x.status_code,'canonical':can.get('href') if can else None,'h1':len(soup.find_all('h1')),'ga':[ga,cfg]}
          for path in sorted(internal):
            rr=S.get(PRE+path,allow_redirects=True,timeout=25)
            if rr.status_code>=400: rep['broken_links'].append([path,rr.status_code]); errors.append(f'broken internal {path}')
          sm=S.get(PRE+'/sitemap.xml',timeout=25); urls=re.findall(r'<loc>(.*?)</loc>',sm.text)
          expected=[PROD+('/' if r=='/' else r) for r in ROUTES]
          rep['sitemap']=urls
          if len(urls)!=11 or set(urls)!=set(expected): errors.append('sitemap not exact 11')
          rob=S.get(PRE+'/robots.txt',timeout=25).text; prob=S.get(PROD+'/robots.txt',timeout=25).text
          if rob!=prob: errors.append('robots changed')
          for r in ROUTES[1:]:
            for suffix in ['.html','/']:
              a=S.get(PRE+r+suffix,allow_redirects=False,timeout=25); b=S.get(PROD+r+suffix,allow_redirects=False,timeout=25)
              rep['variants'][r+suffix]=[[a.status_code,a.headers.get('location')],[b.status_code,b.headers.get('location')]]
              if (a.status_code,a.headers.get('location'))!=(b.status_code,b.headers.get('location')): errors.append(f'variant changed {r+suffix}')
          www=S.get('https://www.osaraclinics.com/',allow_redirects=False,timeout=25)
          rep['www']=[www.status_code,www.headers.get('location')]
          if www.status_code!=301 or not (www.headers.get('location') or '').startswith('https://osaraclinics.com'): errors.append('www redirect')
          rep['errors']=errors
          open('pr6-static.json','w').write(json.dumps(rep,ensure_ascii=False,indent=2))
          print(json.dumps(rep,ensure_ascii=False,indent=2)); sys.exit(1 if errors else 0)
          PY
          python /tmp/pr6_static.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser, responsive, analytics and screenshot checks
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > pr6-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const PRE='https://deploy-preview-6--gregarious-malabi-0dc7e1.netlify.app';
          const ROUTES=['/','/dermatology','/ophthalmology','/doctors/dr-osama-alwreikat','/doctors/dr-sara-abu-touq','/vitiligo-jordan','/botox-hyperhidrosis','/mole-removal','/school-health','/psoriasis-treatment','/acne-scar-treatment'];
          fs.mkdirSync('pr6-screenshots',{recursive:true});
          let errors=[]; let rep={mobile:{},desktop:{},events:{},screenshots:[],analytics:{}};
          const browser=await chromium.launch({headless:true});
          const mctx=await browser.newContext({viewport:{width:390,height:844}});
          for(const r of ROUTES){
            const p=await mctx.newPage(); let ce=[]; p.on('console',m=>{if(m.type()==='error')ce.push(m.text())}); p.on('pageerror',e=>ce.push(String(e)));
            const resp=await p.goto(PRE+r,{waitUntil:'domcontentloaded',timeout:60000}); await p.waitForTimeout(500);
            const closed=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,bw:document.body.scrollWidth,iw:innerWidth,h1:document.querySelectorAll('h1').length,btn:!!document.querySelector('.mobile-menu-btn')}));
            if(!resp||resp.status()!=200) errors.push(r+' browser status'); if(closed.sw>390||closed.bw>390) errors.push(r+' closed overflow'); if(!closed.btn) errors.push(r+' hamburger missing');
            await p.locator('.mobile-menu-btn').first().click(); await p.waitForTimeout(350);
            const drawer=await p.evaluate(()=>{const n=document.querySelector('.main-nav');const rect=n.getBoundingClientRect();const cs=getComputedStyle(n);return{active:n.classList.contains('active'),top:rect.top,bottom:rect.bottom,height:rect.height,vh:innerHeight,right:rect.right,close:!!n.querySelector('.osara-drawer-close'),logo:!!n.querySelector('.osara-drawer-logo'),position:cs.position,sw:document.documentElement.scrollWidth,bw:document.body.scrollWidth,bodyLocked:document.body.classList.contains('osara-nav-open')}});
            if(!drawer.active||Math.abs(drawer.top)>1||Math.abs(drawer.bottom-drawer.vh)>1||Math.abs(drawer.height-drawer.vh)>1||drawer.position!=='fixed'||!drawer.close||!drawer.logo||!drawer.bodyLocked) errors.push(r+' drawer geometry '+JSON.stringify(drawer));
            if(drawer.sw>390||drawer.bw>390) errors.push(r+' open overflow');
            if(r==='/'){await p.screenshot({path:'pr6-screenshots/home-drawer-390x844.png'});rep.screenshots.push('home-drawer-390x844.png');}
            if(r==='/dermatology'){await p.screenshot({path:'pr6-screenshots/dermatology-drawer-390x844.png'});rep.screenshots.push('dermatology-drawer-390x844.png');}
            await p.locator('.osara-drawer-close').click(); await p.waitForTimeout(250); if(await p.locator('.main-nav.active').count()) errors.push(r+' drawer close failed');
            if(ce.length) errors.push(r+' console '+ce.join(' | ')); rep.mobile[r]={closed,drawer,console:ce}; await p.close();
          }
          const dctx=await browser.newContext({viewport:{width:1366,height:900}});
          let homeSig=null;
          for(const r of ROUTES){const p=await dctx.newPage();await p.goto(PRE+r,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(250);const sig=await p.evaluate(()=>{const h=document.querySelector('.main-header'),nav=h?.querySelector('.main-nav'),logo=h?.querySelector('.logo-img'),links=h?.querySelector('.nav-links'),top=document.querySelector('.top-bar');const hc=h?getComputedStyle(h):null,nc=nav?getComputedStyle(nav):null,lc=logo?getComputedStyle(logo):null,tc=top?getComputedStyle(top):null;return{headerPosition:hc?.position,headerBg:hc?.backgroundColor,navDisplay:nc?.display,navDirection:nc?.flexDirection,logoHeight:logo?.getBoundingClientRect().height,topbar:!!top,topbarBg:tc?.backgroundColor,links:[...links?.querySelectorAll('a')||[]].map(a=>a.textContent.trim())}});if(r==='/')homeSig=sig;else{if(sig.headerPosition!=='sticky'||sig.navDisplay!=='flex'||Math.abs((sig.logoHeight||0)-(homeSig.logoHeight||0))>1||sig.topbarBg!==homeSig.topbarBg)errors.push(r+' desktop header signature mismatch '+JSON.stringify(sig));}rep.desktop[r]=sig;await p.close();}
          async function probe(route,selector,expected,forbidden){const p=await mctx.newPage();await p.goto(PRE+route,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(400);await p.evaluate(()=>{window.__pr6calls=[];const orig=window.gtag;window.gtag=function(){window.__pr6calls.push(Array.from(arguments));return orig.apply(this,arguments)}});const loc=p.locator(selector).first();if(!(await loc.count())){errors.push(expected+' selector missing');await p.close();return;}await loc.click({noWaitAfter:true});await p.waitForTimeout(350);const calls=await p.evaluate(()=>window.__pr6calls);const ev=calls.filter(c=>c[0]==='event'&&c[1]===expected);const bad=forbidden?calls.filter(c=>c[0]==='event'&&c[1]===forbidden):[];rep.events[expected]={count:ev.length,calls:ev,bad:bad.length};if(ev.length!==1)errors.push(expected+' count '+ev.length);if(bad.length)errors.push(expected+' also fired '+forbidden);for(const c of ev){const keys=Object.keys(c[2]||{});const allowed=['source_page','specialty','service','campaign'];if(keys.some(k=>!allowed.includes(k)))errors.push(expected+' unsafe key '+keys.join(','));}await p.close();}
          await probe('/dermatology','[data-appointment]','appointment_click','whatsapp_click');
          await probe('/dermatology','.osara-contact-wa','whatsapp_click','appointment_click');
          await probe('/ophthalmology','.osara-contact-call','phone_click');
          await probe('/ophthalmology','.osara-contact-directions','directions_click');
          await probe('/dermatology','.osara-global-header .btn-whatsapp','whatsapp_click','appointment_click');
          const ap=await mctx.newPage();await ap.goto(PRE+'/',{waitUntil:'domcontentloaded',timeout:60000});await ap.waitForTimeout(450);rep.analytics=await ap.evaluate(()=>({gaLoader:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js?id=G-72BY7LC2V2')).length,gaConfig:(window.dataLayer||[]).filter(x=>x&&x[0]==='config'&&x[1]==='G-72BY7LC2V2').length,gtag:typeof window.gtag==='function',pixel:[...document.scripts].filter(s=>s.src.includes('connect.facebook.net')).length,fbq:typeof window.fbq==='function'}));if(rep.analytics.gaLoader!==1||rep.analytics.gaConfig!==1||!rep.analytics.gtag)errors.push('GA4 runtime');if(rep.analytics.pixel>0&&!rep.analytics.fbq)errors.push('Meta Pixel runtime');await ap.close();
          rep.errors=errors;fs.writeFileSync('pr6-browser.json',JSON.stringify(rep,null,2));console.log(JSON.stringify(rep,null,2));await browser.close();process.exit(errors.length?1:0);
          JS
          node pr6-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6-preview-validation
          path: |
            pr6-static.json
            pr6-browser.json
            pr6-screenshots/
